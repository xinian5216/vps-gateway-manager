      - name: Squid version
        run: /usr/sbin/squid -v | head -n 3

      - name: Capability probe (which TLS listener directive works)
        run: bash tests/integration/00-squid-capabilities.sh

      - name: Integration tests (routing, TLS, ACLs)
        run: bash tests/integration/01-routing.sh

      - name: Integration tests (adoption of a running proxy)
        if: always()
        run: bash tests/integration/02-adoption.sh

      - name: Integration tests (production-shaped dry-run)
        if: always()
        run: bash tests/integration/03-production-dry-run.sh

      - name: Integration tests (formal adoption + reconcile)
        if: always()
        run: bash tests/integration/04-adoption-reconcile.sh

      - name: Integration tests (client upstream family reliability)
        if: always()
        run: bash tests/integration/05-client-family.sh
