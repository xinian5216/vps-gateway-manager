name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-and-unit:
    name: shellcheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck bash coreutils

      - name: Versions
        run: |
          bash --version | head -n1
          shellcheck --version

      - name: Static checks (bash -n, shellcheck, policy greps)
        run: bash tests/check.sh

      - name: Unit tests
        run: bash tests/run.sh unit

  integration-debian:
    name: integration (real squid, Debian bookworm)
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4

      - name: Install squid-openssl and tooling
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            squid-openssl ca-certificates curl openssl iproute2 procps

      - name: Squid version
        run: /usr/sbin/squid -v | head -n 3

      - name: Capability probe (which TLS listener directive works)
        run: bash tests/integration/00-squid-capabilities.sh

      - name: Integration tests (routing, TLS, ACLs)
        run: bash tests/integration/01-routing.sh

      - name: Integration tests (adoption of a running proxy)
        if: always()
        run: bash tests/integration/02-adoption.sh

      - name: Integration tests (production-shaped dry-run)
        if: always()
        run: bash tests/integration/03-production-dry-run.sh

      - name: Integration tests (formal adoption + reconcile)
        if: always()
        run: bash tests/integration/04-adoption-reconcile.sh

      - name: Integration tests (client upstream family reliability)
        if: always()
        run: bash tests/integration/05-client-family.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-debian
          path: |
            /tmp/vgm-integ*/**/cache.log
            /tmp/vgm-integ*/*.log
          if-no-files-found: ignore

  integration-debian-trixie:
    name: integration (real squid, Debian trixie)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install squid-openssl and tooling
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            squid-openssl ca-certificates curl openssl iproute2 procps

      - name: Squid version
        run: /usr/sbin/squid -v | head -n 3

      - name: Capability probe (which TLS listener directive works)
        run: bash tests/integration/00-squid-capabilities.sh

      - name: Integration tests (routing, TLS, ACLs)
        run: bash tests/integration/01-routing.sh

      - name: Integration tests (adoption of a running proxy)
        if: always()
        run: bash tests/integration/02-adoption.sh

      - name: Integration tests (production-shaped dry-run)
        if: always()
        run: bash tests/integration/03-production-dry-run.sh

      - name: Integration tests (formal adoption + reconcile)
        if: always()
        run: bash tests/integration/04-adoption-reconcile.sh

      - name: Integration tests (client upstream family reliability)
        if: always()
        run: bash tests/integration/05-client-family.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-debian-trixie
          path: |
            /tmp/vgm-integ*/**/cache.log
            /tmp/vgm-integ*/*.log
          if-no-files-found: ignore

  integration-ubuntu:
    name: integration (real squid, Ubuntu 24.04)
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install squid-openssl and tooling
        run: |
          apt-get update -qq
