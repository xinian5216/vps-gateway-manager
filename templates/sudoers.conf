# =============================================================================
# vps-gateway-manager :: sudo environment passthrough
#
# Installed as /etc/sudoers.d/vps-gateway-manager with mode 0440 after
# `visudo -cf` validation. Only the proxy variables are kept; nothing else
# about the sudo environment is changed.
#
# Why: `sudo apt update` / `sudo git clone` on a client host would otherwise
# lose HTTP(S)_PROXY and silently fail to reach GitHub.
# =============================================================================
Defaults env_keep += "HTTP_PROXY HTTPS_PROXY http_proxy https_proxy NO_PROXY no_proxy"
