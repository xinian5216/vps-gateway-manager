# =============================================================================
# vps-gateway-manager :: Squid configuration for a NEW dedicated proxy server
#
# File state: managed by vps-gateway-manager -- generated, do not edit by hand.
#
# Rendered by:  install.sh server --domain <host> --port 8443
# Managed by:   ghproxyctl
#
# Do not edit by hand. Local changes are overwritten on the next managed
# operation. Use:
#     ghproxyctl domains add <host>     # extend the GitHub destination list
#     ghproxyctl client add <ip> <name> # authorise a client
#
# Security model (see SECURITY.md):
#   * every client is authorised individually as an exact /32 or /128 source
#   * every destination must match the GitHub-only destination list
#   * the plain port is bound to loopback only
# =============================================================================

# --- runtime -----------------------------------------------------------------
visible_hostname @@VISIBLE_HOSTNAME@@
pid_filename @@PID_FILE@@
coredump_dir @@COREDUMP_DIR@@
cache_effective_user @@EFFECTIVE_USER@@
cache_effective_group @@EFFECTIVE_GROUP@@
access_log @@ACCESS_LOG@@ squid
cache_log @@CACHE_LOG@@
logfile_rotate 7
buffered_logs off

# --- listeners ---------------------------------------------------------------
# Public TLS forward proxy. Squid terminates TLS and speaks proxy protocol
# (CONNECT / absolute-URI) to authenticated clients.
http_port @@TLS_PORT@@ tls-cert=@@TLS_CERT@@ tls-key=@@TLS_KEY@@
# Plain HTTP proxy port: loopback only. Used by local health checks and by
# anything running on this host. Never reachable from the internet.
http_port 127.0.0.1:@@LOOPBACK_PORT@@
@@IPV6_LOOPBACK_LISTENER@@

# --- caching -----------------------------------------------------------------
# A forward proxy for source control traffic must never serve stale objects.
cache deny all
cache_mem 32 MB

# --- access control ----------------------------------------------------------
acl gsp_localhost src 127.0.0.1/32 ::1
acl gsp_safe_ports port 80 443 9418 22
acl gsp_connect method CONNECT
acl gsp_github dstdomain "@@DOMAIN_ACL_FILE@@"

# Local cache manager (harmless, loopback only).
http_access allow gsp_localhost manager
http_access deny manager

# Port hygiene: CONNECT and plain requests are limited to web/git ports.
http_access deny !gsp_safe_ports

# Authorised clients (one ACL per client, maintained by ghproxyctl).
include @@CLIENT_ACL_FILE@@

# The operator/health-check path on the box itself. Deliberately restricted to
# GitHub destinations as well: this proxy is not a general-purpose proxy.
http_access allow gsp_localhost gsp_github

# Everything else is refused. No wide-open source or destination rules. (policy-exempt: documentation)
http_access deny all

# --- diagnostics only --------------------------------------------------------
# Never enable cache manager or ICP on a public address.
icp_port 0
cache_mgr @@ADMIN_CONTACT@@
