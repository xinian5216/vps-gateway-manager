# =============================================================================
# vps-gateway-manager :: client-side smart routing proxy
#
# File state: managed by vps-gateway-manager -- generated, do not edit by hand.
#
# Rendered by:  install.sh client --upstream https://proxy.example.com:8443
# Managed by:   ghproxyctl
#
# Behaviour:
#   GitHub destinations   -> @@UPSTREAM_HOST@@:@@UPSTREAM_PORT@@ (TLS parent)
#   every other destination -> DIRECT
#
# This Squid instance is fully self contained: own config, own pid, own logs,
# own cache. It never touches /etc/squid/squid.conf and it only listens on
# loopback, so it cannot become a public proxy.
# =============================================================================

visible_hostname gsp-client-@@CLIENT_TAG@@
pid_filename @@PID_FILE@@
coredump_dir @@COREDUMP_DIR@@
cache_effective_user @@EFFECTIVE_USER@@
cache_effective_group @@EFFECTIVE_GROUP@@
access_log @@ACCESS_LOG@@ squid
cache_log @@CACHE_LOG@@
logfile_rotate 3
buffered_logs off

# --- listeners (loopback only) -----------------------------------------------
http_port 127.0.0.1:@@LOCAL_PORT@@
@@IPV6_LOOPBACK_LISTENER@@

# --- caching -----------------------------------------------------------------
cache deny all
cache_mem 16 MB

# --- upstream TLS parent -----------------------------------------------------
# `tls` makes Squid speak TLS to the upstream proxy; certificate verification
# stays enabled against the system trust store (or --upstream-ca).
cache_peer @@UPSTREAM_HOST@@ parent @@UPSTREAM_PORT@@ 0 no-query no-digest \
    name=gsp_upstream @@PEER_TLS_OPTIONS@@ \
    connect-timeout=20 @@PEER_SSL_DOMAIN@@

# --- routing policy ----------------------------------------------------------
acl gsp_localhost src 127.0.0.1/32 ::1
acl gsp_safe_ports port 80 443 9418 22
acl gsp_github dstdomain "@@DOMAIN_ACL_FILE@@"

# Only GitHub targets may use (and must use) the remote parent.
cache_peer_access gsp_upstream allow gsp_github
cache_peer_access gsp_upstream deny all
never_direct allow gsp_github

# --- access control ----------------------------------------------------------
# Loopback clients only, web/git ports only.
http_access deny !gsp_safe_ports
http_access allow gsp_localhost
http_access deny all
