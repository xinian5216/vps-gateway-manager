# =============================================================================
# integration fixture :: an existing production whitelist
#
# Uses loopback aliases (127.0.0.4/32) so the "existing clients" can really be
# exercised from inside the test container.
#
# Deliberately contains a /64 range and a duplicate entry: adoption must report
# them and must not import them as managed clients.
# =============================================================================

acl github_nodes src 127.0.0.4/32  # existing-node
acl github_nodes src 2001:db8::/64 # legacy-subnet-too-broad
acl github_nodes src 127.0.0.4/32  # duplicate-entry

acl github_domains dstdomain "@@ROOT@@/etc/squid/conf.d/github-domains.txt"

http_access allow github_nodes github_domains
