# =============================================================================
# test fixture :: existing client ACL file (the file this project must adopt
# but never rewrite)
#
# Deliberately contains everything the adoption logic has to cope with:
#   * IPv4 /32 and IPv6 /128 entries with node names in the trailing comment
#   * an entry without a comment
#   * a legacy /24 range that must NOT be imported as a managed client
#   * a duplicate address
#   * the destination ACL + the allow rule this project must not disturb
# =============================================================================

acl github_nodes src 203.0.113.10/32  # tencent-bj-01
acl github_nodes src 2001:db8::10/128 # v6-node
acl github_nodes src 198.51.100.7/32
acl github_nodes src 198.51.100.0/24  # legacy-subnet-too-broad
acl github_nodes src 203.0.113.10/32  # duplicate-entry

acl github_domains dstdomain "@@ROOT@@/etc/squid/conf.d/github-domains.txt"

http_access allow github_nodes github_domains
