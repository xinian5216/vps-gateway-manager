# =============================================================================
# test fixture :: an existing production squid.conf
#
# Modelled on a Debian/Ubuntu Squid installation that already serves as a
# GitHub-only HTTPS forward proxy. @@ROOT@@ is replaced with the sandbox path
# by the test-suite.
# =============================================================================

acl localhost src 127.0.0.1/32 ::1
acl to_localhost dst 127.0.0.0/8 0.0.0.0/32 ::1
acl SSL_ports port 443
acl Safe_ports port 80 443 9418
acl CONNECT method CONNECT

http_access allow localhost manager
http_access deny manager
include @@ROOT@@/etc/squid/conf.d/*.conf
http_access deny !Safe_ports
http_access allow localhost
http_access deny all

http_port 8443 tls-cert=@@ROOT@@/etc/squid/tls/fullchain.pem tls-key=@@ROOT@@/etc/squid/tls/privkey.pem
http_port 127.0.0.1:3128

cache deny all
cache_effective_user proxy
cache_effective_group proxy
coredump_dir @@ROOT@@/var/spool/squid
access_log @@ROOT@@/var/log/squid/access.log squid
cache_log @@ROOT@@/var/log/squid/cache.log
pid_filename @@ROOT@@/run/squid.pid
visible_hostname gh.smartproxy.test
