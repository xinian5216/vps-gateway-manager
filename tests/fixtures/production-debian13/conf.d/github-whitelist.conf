# =============================================================================
# test fixture :: the operator's own conf.d file on a Debian 13 host
#
# This file is externally managed: the project must adopt it read-only and must
# never rewrite it. It deliberately contains every shape the discovery code has
# to understand:
#
#   * six exact client hosts (IPv4 /32 and IPv6 /128)
#   * several `acl <same-name> src ...` lines, and one line carrying several
#     addresses (Squid ORs them - normal, not a duplicate to warn about)
#   * inline dstdomain values (no list file anywhere)
#   * one dstdomain line with several domains
#   * the same destination repeated in another definition
#   * a broad CDN entry that must NOT be imported (narrow policy)
#   * the TLS listener: it is NOT in the main squid.conf
#
# @@CERT@@ is replaced with the sandbox certificate directory.
# =============================================================================

acl allowed_clients src 203.0.113.11/32 203.0.113.12/32
acl allowed_clients src 203.0.113.13/32
acl allowed_clients src 2001:db8::11/128
acl allowed_clients src 2001:db8::12/128 2001:db8::13/128

acl github_dst dstdomain .github.com
acl github_dst dstdomain .githubusercontent.com
acl github_dst dstdomain .githubassets.com
acl github_dst dstdomain ghcr.io
acl github_dst dstdomain .github.com .githubusercontent.com
acl github_dst dstdomain .cloudfront.net

acl CONNECT method CONNECT

http_access allow allowed_clients CONNECT SSL_ports github_dst
http_access deny allowed_clients
http_access deny all

https_port 8443 tls-cert=@@CERT@@/fullchain.pem tls-key=@@CERT@@/privkey.pem
