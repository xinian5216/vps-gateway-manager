# =============================================================================
# test fixture :: a production Debian 13 (trixie) squid.conf
#
# Modelled on a real host where the GitHub-only HTTPS forward proxy keeps
#
#   * the standard Debian ACL boilerplate and the final "deny all" in the main
#     file,
#   * the two loopback listeners in the main file,
#   * the TLS listener, the client ACLs, the inline destination ACLs and the
#     allow/deny rules in an INCLUDED conf.d file.
#
# Reading only the main file cannot discover the TLS listener or the
# destinations - exactly the shape that must be supported.
#
# @@ROOT@@ is replaced with the sandbox path by the test suite.
# =============================================================================

acl localhost src 127.0.0.1/32 ::1
acl to_localhost dst 127.0.0.0/8 0.0.0.0/32 ::1
acl SSL_ports port 443
acl Safe_ports port 80 443 9418
acl CONNECT method CONNECT

http_access allow localhost manager
http_access deny manager

include @@ROOT@@/etc/squid/conf.d/*.conf

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow localhost
http_access deny all

http_port 127.0.0.1:3128
http_port [::1]:3128

cache deny all
cache_effective_user proxy
cache_effective_group proxy
coredump_dir @@ROOT@@/var/spool/squid
access_log @@ROOT@@/var/log/squid/access.log squid
cache_log @@ROOT@@/var/log/squid/cache.log
pid_filename @@ROOT@@/run/squid.pid
visible_hostname gh.smartproxy.test
logfile_rotate 0
